  --bg0: #04080a;
  --bg1: #070f12;
  --bg2: #0a161a;
  --bg3: #0e1d22;
  --line: #14262b;
  --line-bright: #22424a;
  --txt-hi: #d9f2ea;
  --txt-mid: #83a89e;
  --txt-low: #4a6a61;
  --acc: #35f0a5;
  --acc-dim: #157a52;
  --acc-glow: rgba(53, 240, 165, 0.16);
  --cy: #57d7ff;
  --am: #ffb454;
  --or: #ff8a3d;
  --rd: #ff4d5e;
  --th-critical: #ff4d5e;
  --th-high: #ff8a3d;
  --th-medium: #ffc857;
  --th-low: #8fe3a2;
  --th-minimal: #5f7f76;
  --font-display: 'Rajdhani', ui-sans-serif, system-ui, sans-serif;
  --font-mono-ui: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html, body {
  background: var(--bg0);
  color: var(--txt-hi);
  overscroll-behavior: none;
}
body {
  font-family: var(--font-mono-ui), ui-monospace, monospace;
  -webkit-font-smoothing: antialiased;
  margin: 0;
}
.font-display {
  font-family: var(--font-display), sans-serif;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.spin-slow {
  animation: spin 2.2s linear infinite;
}
.panel {
  background: linear-gradient(180deg, rgba(14, 29, 34, 0.55), rgba(7, 15, 18, 0.85));
  border: 1px solid var(--line);
}
.panel-head {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--line);
  background: rgba(10, 22, 26, 0.7);
}
.panel-title {
  font-family: var(--font-display), sans-serif;
  font-weight: 600;
  letter-spacing: 0.14em;
  font-size: 0.68rem;
  color: var(--txt-mid);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 0.45rem;
}
.panel-title::before {
  content: "";
  width: 5px;
  height: 5px;
  background: var(--acc);
  box-shadow: 0 0 6px var(--acc);
  flex: none;
}
.hud-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.2rem 0.55rem;
  background: rgba(7, 15, 18, 0.82);
  border: 1px solid var(--line);
  backdrop-filter: blur(6px);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  color: var(--txt-mid);
  white-space: nowrap;
}
.map-frame {
  position: relative;
  overflow: hidden;
}
.map-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(2, 6, 8, 0.55) 100%);
  mix-blend-mode: screen;
  opacity: 0.75;
}
.glow-acc {
  text-shadow: 0 0 8px var(--acc-glow), 0 0 2px rgba(53,240,165,.5);
}
.glow-rd {
  text-shadow: 0 0 8px rgba(255, 77, 94, 0.35);
}
@keyframes pulse-dot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
.pulse-dot {
  animation: pulse-dot 1.6s ease-in-out infinite;
}
@keyframes blink-soft {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.55;
  }
}
.blink-soft {
  animation: blink-soft 1.1s ease-in-out infinite;
}
@keyframes ping-ring {
  0% {
    transform: scale(0.6);
    opacity: 0.9;
  }
  100% {
    transform: scale(2.2);
    opacity: 0;
  }
}
.ping-ring {
  animation: ping-ring 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
}
@keyframes sweep-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.sweep-in {
  animation: sweep-in 0.35s ease-out both;
}
@keyframes critical-flash {
  0%, 100% {
    border-color: var(--line);
  }
  50% {
    border-color: rgba(255, 77, 94, 0.65);
  }
}
.critical-flash {
  animation: critical-flash 1.2s ease-in-out infinite;
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--line-bright) transparent;
}
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--line-bright);
  border-radius: 4px;
  border: 2px solid var(--bg1);
}
::-webkit-scrollbar-thumb:hover {
  background: #2e5560;
}
::selection {
  background: rgba(53, 240, 165, 0.25);
  color: var(--txt-hi);
}
:focus-visible {
  outline: 1px solid var(--acc);
  outline-offset: 1px;
}
.boot-scan {
  background: linear-gradient(180deg, transparent 0%, rgba(53, 240, 165, 0.06) 48%, rgba(53, 240, 165, 0.1) 50%, transparent 52%, transparent 100%);
  background-size: 100% 220px;
  animation: boot-scan-move 2.4s linear infinite;
}
@keyframes boot-scan-move {
  from {
    background-position: 0 -220px;
  }
  to {
    background-position: 0 100vh;
  }
}
.grid-lines {
  background-image: linear-gradient(rgba(53, 240, 165, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(53, 240, 165, 0.04) 1px, transparent 1px);
  background-size: 44px 44px;
}
.track-row {
  display: grid;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.6rem;
  border: 1px solid transparent;
  border-bottom: 1px solid rgba(20, 38, 43, 0.6);
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease;
}
.track-row:hover {
  background: rgba(14, 29, 34, 0.85);
}
.track-row[data-selected="true"] {
  background: rgba(23, 52, 46, 0.5);
  border-color: rgba(53, 240, 165, 0.35);
}
.tabular {
  font-variant-numeric: tabular-nums;
}
.toast-item {
  animation: sweep-in 0.28s ease-out both;
  border-radius: 0;
}
